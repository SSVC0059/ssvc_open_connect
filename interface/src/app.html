<!DOCTYPE html>
<html lang="ru" data-theme="corporate">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f0f4f8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1f2937" media="(prefers-color-scheme: dark)" />
		<script>
			// Тема применяется до отрисовки, чтобы не было вспышки (FOUC).
			(function () {
				try {
					var stored = localStorage.getItem('ssvc-theme');
					var theme =
						stored === 'corporate' || stored === 'business'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'business'
								: 'corporate';
					document.documentElement.setAttribute('data-theme', theme);
				} catch (error) {
					// localStorage может быть недоступен — остаётся corporate по умолчанию.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
